spring.application.name=hrms-system

# ===============================
# DATABASE
# ===============================
spring.datasource.url=${DATABSE_URL}
spring.datasource.username=${DATABSE_USERNAME}
spring.datasource.password=${DATABSE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver


# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# ===============================
# SERVER
# ===============================
server.port=${PORT:8090}


# ===============================
# SECURITY
# ===============================
# No user store is implemented yet; disable the generated default user.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.com.hrms.hrms_system=INFO
